<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite Wheel - Click to View Variants</title><style>
body { background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
h1 { text-align: center; } h2 { color: #4ade80; border-bottom: 1px solid #333; padding-bottom: 8px; margin-top: 40px; text-transform: capitalize; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.card { background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid #333; cursor: pointer; }
.card:hover { border-color: #4ade80; }
.card img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #000; display: block; }
.card .label { padding: 8px 12px; font-size: 12px; color: #aaa; }
.card .label strong { color: #fff; display: block; font-size: 13px; }
.card .badge { display: inline-block; background: #4ade80; color: #000; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-top: 4px; }
.count { text-align: center; color: #666; margin-bottom: 20px; }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
.modal.active { display: block; }
.modal-content { max-width: 1200px; margin: 0 auto; }
.modal .close { position: fixed; top: 20px; right: 30px; font-size: 36px; color: #fff; cursor: pointer; background: none; border: none; }
.modal .variant-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-top: 20px; }
.modal .variant-card { background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid #444; }
.modal .variant-card img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #000; display: block; }
.modal .variant-card .vlabel { padding: 8px 12px; font-size: 11px; color: #888; word-break: break-all; }
</style></head><body>
<h1>🐍 Sprite Wheel - What's In Game</h1><div class="count"></div><div id="wheel"></div>
<div class="modal" id="modal"><button class="close" onclick="closeModal()">&times;</button><div class="modal-content"><h2 id="modal-title"></h2><div class="variant-grid" id="modal-grid"></div></div></div>
<script>
const poolData = {"Lereh": {"juvenile.Red": ["/hatchery/snakes/localities/jayapura/red-neonate-1.webp"], "adult.Red": ["/hatchery/snakes/localities/lereh/red-adult-2.webp", "/hatchery/snakes/localities/lereh/red-adult.webp"]}, "Wamena": {"juvenile.Red": ["/hatchery/snakes/localities/jayapura/red-neonate-1.webp"], "adult.Red": ["/hatchery/snakes/localities/wamena/red-adult-orig.webp", "/hatchery/snakes/localities/wamena/wamena-aru-cross-orig.webp"]}, "Cyclops": {"juvenile.Red": ["/hatchery/snakes/localities/cyclops/red-neonate-2.webp", "/hatchery/snakes/localities/cyclops/red-neonate-3.webp"], "adult.Red": ["/hatchery/snakes/localities/cyclops/red-adult-6.webp", "/hatchery/snakes/localities/cyclops/red-adult-1.webp", "/hatchery/snakes/localities/cyclops/red-adult-2.webp", "/hatchery/snakes/localities/cyclops/red-adult-3.webp", "/hatchery/snakes/localities/cyclops/red-adult-blue-phase.webp"]}, "Manokwari": {"juvenile.Red": ["/hatchery/snakes/localities/manokwari/red-neonate.webp"], "adult.Red": ["/hatchery/snakes/localities/manokwari/red-adult-2.webp", "/hatchery/snakes/localities/manokwari/red-adult.webp", "/hatchery/snakes/localities/manokwari/red-adult-a-plus.webp"]}, "Arfak": {"juvenile.Red": ["/hatchery/snakes/localities/arfak/red-neonate.webp"], "adult.Red": ["/hatchery/snakes/localities/arfak/red-adult.webp"]}, "Sorong": {"adult.Red": ["/hatchery/snakes/localities/sorong/red-adult.webp"]}, "Timika": {"juvenile.Red": ["/hatchery/snakes/localities/timika/red-neonate.webp"], "adult.Red": ["/hatchery/snakes/localities/timika/blue-adult.webp", "/hatchery/snakes/localities/timika/red-adult.webp"]}, "Kofiau": {"juvenile.Yellow": ["/hatchery/snakes/localities/kofiau/yellow-neonate.webp"], "adult.Yellow": ["/hatchery/snakes/localities/kofiau/yellow-adult-5.webp", "/hatchery/snakes/localities/kofiau/yellow-adult-1.webp", "/hatchery/snakes/localities/kofiau/yellow-adult-2.webp", "/hatchery/snakes/localities/kofiau/yellow-adult-3.webp", "/hatchery/snakes/localities/kofiau/yellow-adult-orig.webp", "/hatchery/snakes/localities/kofiau/yellow-adult-6.webp"]}, "Jayapura": {"juvenile.Red": ["/hatchery/snakes/localities/jayapura/red-neonate-1.webp", "/hatchery/snakes/localities/jayapura/red-neonate-2.webp", "/hatchery/snakes/localities/jayapura/red-neonate-4.webp"], "adult.Red": ["/hatchery/snakes/localities/jayapura/red-adult-3.webp", "/hatchery/snakes/localities/jayapura/red-adult.webp", "/hatchery/snakes/localities/jayapura/red-adult-2.webp", "/hatchery/snakes/localities/jayapura/red-adult-a-plus.webp"]}, "Biak": {"juvenile.Red": ["/hatchery/snakes/localities/biak/red-neonate.webp"], "adult.Red": ["/hatchery/snakes/localities/biak/red-adult.webp"]}, "Aru": {"juvenile.Yellow": ["/hatchery/snakes/localities/aru/yellow-neonate-2.webp"], "adultAny": ["/hatchery/snakes/localities/aru/adult-2.webp", "/hatchery/snakes/localities/aru/adult.webp", "/hatchery/snakes/localities/aru/adult-a-plus.webp"]}, "Merauke": {"juvenile.Yellow": ["/hatchery/snakes/localities/merauke/yellow-neonate-2.webp", "/hatchery/snakes/localities/merauke/yellow-neonate.webp"], "adultAny": ["/hatchery/snakes/localities/merauke/adult.webp", "/hatchery/snakes/localities/merauke/yellow-adult.webp"]}, "Batanta": {"juvenile.Yellow": ["/hatchery/snakes/localities/batanta/yellow-neonate.webp", "/hatchery/snakes/localities/batanta/yellow-neonate-2.webp"]}, "Waigeo": {"juvenile.Yellow": ["/hatchery/snakes/localities/waigeo/yellow-neonate.webp"]}, "Designer": {"juvenile.Red": ["/hatchery/snakes/localities/designer/red-neonate.webp"], "adult.Red": ["/hatchery/snakes/localities/jayapura/red-adult.webp"]}, "Hybrid": {"juvenile.Red": ["/hatchery/snakes/localities/jayapura/red-neonate-1.webp", "/hatchery/snakes/localities/hybrids/pulcher-utaraensis-red-neonate.webp"], "adult.Red": ["/hatchery/snakes/localities/hybrids/pulcher-utaraensis-red-adult.webp"]}};
function buildWheel() {
  const wheel = document.getElementById('wheel');
  let html = ''; const locs = Object.keys(poolData).sort();
  let totalPools = 0, totalVariants = 0;
  for (const loc of locs) {
    const pools = poolData[loc]; const poolNames = Object.keys(pools).sort();
    totalPools += poolNames.length;
    html += `<h2>${loc}</h2><div class="grid">`;
    for (const pool of poolNames) {
      const variants = pools[pool]; totalVariants += variants.length;
      const first = variants[0]; const fname = first.split('/').pop();
      const displayPool = pool.replace('.', ' ').replace('Any', ' (any)');
      html += `<div class="card" onclick="showVariants('${loc}', '${pool}')"><img src="${first}" loading="lazy"><div class="label"><strong>${displayPool}</strong><span class="badge">${variants.length} variant${variants.length > 1 ? 's' : ''}</span></div></div>`;
    }
    html += '</div>';
  }
  wheel.innerHTML = html;
  document.querySelector('.count').textContent = `${totalPools} pools, ${totalVariants} variants wired — click any pool to see all variants`;
}
function showVariants(loc, pool) {
  const variants = poolData[loc][pool];
  document.getElementById('modal-title').textContent = `${loc} — ${pool.replace('.', ' ')} (${variants.length})`;
  document.getElementById('modal-grid').innerHTML = variants.map(v => {
    const fname = v.split('/').pop();
    return `<div class="variant-card"><img src="${v}" loading="lazy"><div class="vlabel">${fname}<br>${v}</div></div>`;
  }).join('');
  document.getElementById('modal').classList.add('active');
}
function closeModal() { document.getElementById('modal').classList.remove('active'); }
document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
buildWheel();
</script></body></html>
